{% extends "base.html" %}
{% block content %}
<h2>New Exam</h2>
<form method="POST">
  <div class="mb-3">
    <label class="form-label">Subject</label>
    <input type="text" name="subject" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Scheduled Start</label>
    <input type="datetime-local" name="scheduled_start" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Duration (minutes)</label>
    <input type="number" name="duration_minutes" class="form-control" required>
  </div>
  <button type="submit" class="btn btn-success">Create Exam</button>
</form>
{% endblock %}
