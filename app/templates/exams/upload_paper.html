{% extends "base.html" %}
{% block content %}
<h2>Upload Paper for {{ exam.subject }}</h2>
<form method="POST">
  <div class="mb-3">
    <label class="form-label">Question Paper Content</label>
    <textarea name="content" class="form-control" rows="8" required></textarea>
  </div>
  <button type="submit" class="btn btn-success">Upload & Encrypt</button>
</form>
{% endblock %}
